<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" viewBox="0 0 1440 900" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="title description">
  <title id="title">YLLW</title>
  <desc id="description">Educational learning platform for students.</desc>



  <foreignObject x="0" y="0" width="1440" height="900">
    <html xmlns="http://www.w3.org/1999/xhtml">
      <head>
        <style>
          * { box-sizing: border-box; }
          html, body {
            width: 100%;
            height: 100%;
            min-height: 100%;
            margin: 0;
            overflow: hidden;
          }
          :root {
            color-scheme: dark;
            --yellow: #ffe51c;
            --orange: #ff6a16;
            --ink: #050505;
            --paper: #f4f1db;
            --muted: #697785;
          }
          body {
            position: relative;
            overflow: hidden;
            background:
              radial-gradient(circle at 92% 10%, rgba(255, 91, 22, 0.06), transparent 13%),
              radial-gradient(circle at 19% 90%, rgba(255, 106, 22, 0.07), transparent 15%),
              linear-gradient(135deg, #050505 0%, #11131a 48%, #020202 100%);
            color: #f4f1db;
            font-family: "Courier New", Courier, monospace;
          }
          body:before {
            content: "";
            position: absolute;
            inset: 0;
            background: linear-gradient(120deg, rgba(255, 255, 255, 0.11), rgba(255, 255, 255, 0.015) 32%, transparent 62%);
            pointer-events: none;
          }
          .shell {
            position: relative;
            width: 100%;
            min-height: 100%;
            padding: clamp(20px, 4.7vw, 68px);
            padding-top: 0;
          }
          .topbar {
            height: clamp(88px, 14vh, 126px);
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid rgba(255, 229, 28, 0.24);
          }
          .brand {
            display: flex;
            align-items: baseline;
            gap: 16px;
            color: #ffe51c;
            letter-spacing: 0;
            text-decoration: none;
            text-shadow: 0 0 18px rgba(255, 229, 28, 0.55);
          }
          .brand strong { font-size: 46px; line-height: 1; }
          .brand span {
            color: #ff7a16;
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 4px;
            text-transform: uppercase;
          }
          .main {
            display: grid;
            grid-template-columns: clamp(210px, 20vw, 286px) minmax(0, 1fr);
            gap: clamp(24px, 3.3vw, 48px);
            height: calc(100% - clamp(88px, 14vh, 126px));
            min-height: 0;
            padding-top: clamp(32px, 6.9vh, 62px);
          }
          .main section { min-width: 0; }
          @media (max-width: 900px) {
            .shell { padding: 0 24px; }
            .topbar { height: 82px; }
            .main {
              grid-template-columns: 180px minmax(0, 1fr);
              gap: 24px;
              height: calc(100% - 82px);
              padding-top: 28px;
            }
            .rail { padding-right: 18px; }
            .brand strong { font-size: 36px; }
            .search-title { font-size: clamp(64px, 11vw, 96px); }
            .search-field { padding: 0 16px; }
          }
          @media (max-height: 650px) {
            .topbar { height: 72px; }
            .main { height: calc(100% - 72px); padding-top: 18px; }
            .search-title { margin: 8px 0 16px; font-size: 64px; }
            .search { height: 62px; }
            .rail-item { min-height: 52px; }
          }
          .search-title {
            width: 100%;
            margin: 12px 0 24px;
            color: #ffe51c;
            font-size: clamp(64px, 8vw, 96px);
            line-height: 0.9;
            text-align: center;
            letter-spacing: 0;
            text-shadow: 0 0 28px rgba(255, 229, 28, 0.58), 8px 8px 0 rgba(255, 106, 22, 0.16);
          }
          .search {
            display: grid;
            grid-template-columns: 1fr 70px;
            height: 70px;
            border: 1px solid rgba(255, 229, 28, 0.55);
            background: rgba(5, 5, 6, 0.84);
            box-shadow: 0 18px 60px rgba(0, 0, 0, 0.45), inset 0 0 24px rgba(255, 229, 28, 0.025);
          }
          .search-field {
            display: flex;
            align-items: center;
            gap: 16px;
            min-width: 0;
            padding: 0 24px;
          }
          .prompt { flex: none; color: #ff6a16; font-size: 15px; font-weight: 700; }
          .search-field input {
            width: 100%;
            min-width: 0;
            border: 0;
            outline: 0;
            background: transparent;
            color: #f4f1db;
            font: 15px "Courier New", Courier, monospace;
          }
          .search-field input::placeholder { color: #697785; opacity: 1; }
          .go {
            display: grid;
            place-items: center;
            border: 0;
            border-left: 1px solid rgba(255, 229, 28, 0.55);
            border-radius: 0;
            background: #ffe51c;
            color: #090909;
            font: 700 26px "Courier New", Courier, monospace;
            cursor: pointer;
          }
          .go:hover, .go:focus-visible { background: #fff36a; outline: 3px solid #168cff; outline-offset: -3px; }
          .search:focus-within { border-color: #ffe51c; box-shadow: 0 18px 60px rgba(0, 0, 0, 0.45), 0 0 24px rgba(255, 229, 28, 0.12); }
          .rail {
            border-right: 1px solid rgba(255, 106, 22, 0.32);
            padding: 8px 28px 0 0;
          }
          .rail h2 {
            margin: 0 0 18px;
            color: #ff7a16;
            font-size: 11px;
            letter-spacing: 3px;
            text-transform: uppercase;
          }
          .rail-item {
            display: grid;
            grid-template-columns: 34px 1fr;
            align-items: center;
            width: 100%;
            min-height: 58px;
            padding: 0;
            border: 0;
            border-bottom: 1px solid #33271f;
            background: transparent;
            color: inherit;
            font: inherit;
            text-align: left;
            text-decoration: none;
            cursor: pointer;
          }
          .rail-item:hover, .rail-item:focus-visible {
            background: rgba(255, 106, 22, 0.1);
            outline: 0;
          }
          .rail-item:hover strong, .rail-item:focus-visible strong { color: #ff7a16; }
          .rail-item .icon {
            display: grid;
            width: 22px;
            height: 22px;
            place-items: center;
            color: #ff7a16;
          }
          .rail-item .icon svg {
            width: 18px;
            height: 18px;
          }
          .rail-item strong { color: #dedbd0; font-size: 13px; font-weight: 700; }
          .footer {
            position: absolute;
            left: clamp(24px, 4.7vw, 68px);
            right: clamp(24px, 4.7vw, 68px);
            bottom: clamp(18px, 4vh, 37px);
            display: flex;
            justify-content: space-between;
            border-top: 1px solid #242934;
            padding-top: 18px;
            color: #4f5964;
            font-size: 9px;
            letter-spacing: 2px;
            text-transform: uppercase;
          }
          .footer span:last-child { color: #ff6a16; }
          .browser { min-width: 0; min-height: 0; }
          .status {
            height: 28px;
            padding: 8px 2px 0;
            color: var(--muted);
            font-size: 10px;
            letter-spacing: 1px;
            text-transform: uppercase;
          }
          .viewport {
            display: none;
            width: 100%;
            height: calc(100% - 174px);
            min-height: 260px;
            border: 1px solid rgba(255, 229, 28, 0.34);
            background: #fff;
          }
          .browser.active .search-title { display: none; }
          .browser.active .viewport { display: block; }
          .browser.active .search { height: 58px; }
          .browser.active .status { height: 20px; }
        </style>
      </head>
      <body>
        <div class="shell">
          <header class="topbar">
            <a class="brand" href="#yllw" aria-label="YLLW home"><strong>YLLW</strong><span>/ proxy</span></a>
          </header>

          <main class="main">
            <aside class="rail">
              <h2 id="school-library">School library</h2>
              <button class="rail-item" type="button" data-url="https://www.google.com" aria-label="Open Games"><span class="icon" aria-hidden="true">#</span><strong>Games</strong></button>
              <button class="rail-item" type="button" data-url="https://www.netflix.com" aria-label="Open Movies"><span class="icon" aria-hidden="true">&#x25B6;</span><strong>Movies</strong></button>
              <button class="rail-item" type="button" data-url="https://open.spotify.com" aria-label="Open Music"><span class="icon" aria-hidden="true">&#x266C;</span><strong>Music</strong></button>
              <button class="rail-item" type="button" data-url="https://www.wikipedia.org" aria-label="Open Apps"><span class="icon" aria-hidden="true">&#x25A6;</span><strong>Apps</strong></button>
            </aside>

            <section class="browser" id="browser">
              <h1 class="search-title" id="yllw">YLLW</h1>
              <form class="search" id="search" role="search">
                <label class="search-field" for="address">
                  <span class="prompt" aria-hidden="true">&gt;</span>
                  <input id="address" name="address" type="url" inputmode="url" autocomplete="url" placeholder="enter target address" aria-label="Target address"/>
                </label>
                <button class="go" type="submit" aria-label="Navigate">&#x2192;</button>
              </form>
              <div class="status" id="status" role="status">loading proxy runtime</div>
              <iframe class="viewport" id="viewport" title="Proxied content" sandbox="allow-same-origin allow-scripts allow-forms allow-downloads allow-popups allow-pointer-lock allow-modals"></iframe>
            </section>
          </main>

          <footer class="footer"><span>YLLW:// interface build 00.2</span></footer>
        </div>
        <script src="./scramjet/scramjet.all.js"><![CDATA[]]></script>
        <script>
          <![CDATA[
          async function initializeProxy() {
          const documentBase = new URL('./', document.baseURI);
          const runtimeBase = new URL('./scramjet/', document.baseURI);
          const bareMuxUrl = new URL('./scramjet/bare-mux.js', document.baseURI).href;
          const { BareMuxConnection } = await import(bareMuxUrl);
          const asset = (name) => new URL(name, runtimeBase).href;
          const browser = document.querySelector('#browser');
          const form = document.querySelector('#search');
          const address = document.querySelector('#address');
          const status = document.querySelector('#status');
          const viewport = document.querySelector('#viewport');
          const parentUrl = window.location.href;

          const setStatus = (message) => {
            status.textContent = message;
          };

          const normalizeUrl = (value) => {
            const candidate = value.trim();
            if (!candidate) throw new Error('Enter a URL');
            const url = new URL(/^https?:\/\//i.test(candidate) ? candidate : `https://${candidate}`);
            if (!/^https?:$/.test(url.protocol)) throw new Error('Use an http or https URL');
            return url;
          };

          const withTimeout = (promise, milliseconds, label) => Promise.race([
            promise,
            new Promise((_, reject) => {
              setTimeout(() => reject(new Error(`${label} timed out after ${milliseconds / 1000}s`)), milliseconds);
            })
          ]);

          let frame;
          try {
            setStatus('registering proxy worker');
            await withTimeout(navigator.serviceWorker.register(new URL('./sw.js', documentBase), { scope: documentBase.href }), 8000, 'worker registration');
            setStatus('waiting for proxy worker');
            await withTimeout(navigator.serviceWorker.ready, 8000, 'worker activation');

            setStatus('starting bare transport');
            const pageUrl = new URL(window.location.href);
            const bareUrl = new URL(pageUrl);
            if (pageUrl.hostname === 'localhost' || pageUrl.hostname === '127.0.0.1') {
              bareUrl.protocol = 'http:';
              bareUrl.port = '8080';
            } else if (pageUrl.hostname.endsWith('.app.github.dev')) {
              bareUrl.protocol = 'https:';
              bareUrl.port = '8080';
            } else {
              bareUrl.protocol = 'https:';
              bareUrl.port = '8080';
            }
            bareUrl.pathname = '/';
            bareUrl.search = '';
            bareUrl.hash = '';
            const bareServer = bareUrl.href;
            setStatus(`connecting to bare server ${bareServer}`);
            if (!/^https?:\/\//i.test(bareServer)) throw new Error('Invalid bare server URL');
            new URL('./v3/', bareServer);
            const mux = new BareMuxConnection(asset('bare-mux-worker.js'));
            await mux.setTransport(asset('bare-client.mjs'), [bareServer]);

            setStatus('loading scramjet controller');
            const { ScramjetController } = $scramjetLoadController();
            setStatus('starting scramjet');
            const controller = new ScramjetController({
              prefix: runtimeBase.pathname,
              files: {
                wasm: asset('scramjet.wasm.wasm'),
                all: asset('scramjet.all.js'),
                sync: asset('scramjet.sync.js')
              }
            });
            await controller.init();

            frame = controller.createFrame(viewport);
            frame.addEventListener('urlchange', (event) => {
              address.value = event.url;
              setStatus(`loaded ${event.url}`);
            });
            frame.addEventListener('navigate', (event) => {
              setStatus(`loading ${event.url}`);
            });
            setStatus('proxy ready');
          } catch (error) {
            console.error(error);
            const detail = error && error.stack ? ` - ${error.stack.split('\n')[1]?.trim() || ''}` : '';
            setStatus(`proxy unavailable: ${error.message}${detail}`);
          }

          const navigate = (value) => {
            if (!frame) return;
            try {
              const url = normalizeUrl(value);
              address.value = url.href;
              browser.classList.add('active');
              setStatus(`loading ${url.href}`);
              frame.go(url);
            } catch (error) {
              setStatus(error.message);
              address.focus();
            }
          };

          form.addEventListener('submit', (event) => {
            event.preventDefault();
            navigate(address.value);
          });

          document.querySelectorAll('[data-url]').forEach((item) => {
            item.addEventListener('click', () => navigate(item.dataset.url));
          });

          window.addEventListener('popstate', () => {
            if (window.location.href !== parentUrl) {
              history.replaceState(null, '', parentUrl);
            }
          });
          }

          initializeProxy().catch((error) => {
            console.error(error);
            document.querySelector('#status').textContent = `proxy unavailable: ${error.message}`;
          });
          ]]>
        </script>
      </body>
    </html>
  </foreignObject>
</svg>
